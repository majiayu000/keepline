name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  app:
    name: TypeScript and Bun tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install web client dependencies
        working-directory: src/web/client
        run: bun install --frozen-lockfile

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pinned pnpm for real command fixtures
        run: npm install --global pnpm@10.11.0

      - name: Install locked menubar dependencies
        working-directory: menubar-tauri
        run: npm ci

      - name: Test DMG notarization failure gates
        run: python3 menubar-tauri/scripts/test_notarize_dmg.py

      - name: Build menubar frontend
        working-directory: menubar-tauri
        run: npm run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  tauri:
    name: Tauri Rust checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install web client dependencies
        working-directory: src/web/client
        run: bun install --frozen-lockfile

      - name: Build dashboard and embedded service for Tauri checks
        run: bun run scripts/build-ledger-app.ts

      - name: Cargo check
        working-directory: menubar-tauri/src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: menubar-tauri/src-tauri
        run: cargo test --lib

      # The desktop product and zero-tolerance font rendering target macOS.
      - name: Install browser for UI checks
        working-directory: src/web/client
        run: bun x playwright install chromium

      - name: Test UI workflows and macOS visual regression
        working-directory: src/web/client
        run: bun run test:ui

  # peer_uid calls libc::getpeereid, which the Ubuntu app job cannot build.
  keeplined:
    name: keeplined Rust checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt
        run: cargo fmt --check --manifest-path next/Cargo.toml

      - name: Cargo clippy
        run: cargo clippy --manifest-path next/Cargo.toml --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --manifest-path next/Cargo.toml
