[package]
name = "keeplined"
version = "0.0.0"
edition = "2021"
publish = false
description = "Keepline workbench host"
license = "MIT"

[[bin]]
name = "keeplined"
path = "src/main.rs"

[dependencies]
regex = "1"
shlex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
keepline-core = { path = "../keepline-core" }
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
