[package]
name = "keeplined"
version = "0.0.0"
edition = "2021"
publish = false
description = "Experimental Keepline managed PTY daemon (protocol major 0)"
license = "MIT"

[[bin]]
name = "keeplined"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "=0.25.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
