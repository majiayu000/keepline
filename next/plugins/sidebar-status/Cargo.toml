[package]
name = "sidebar-status"
version = "0.1.0"
edition = "2024"
publish = false

# A guest crate built for wasm32-unknown-unknown; it is not a member of the host workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
