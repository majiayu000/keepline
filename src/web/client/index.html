<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Monitor, recover, and manage local agent runtime sessions" />
    <meta name="theme-color" content="#F7F8FA" />
    <title>Keepline</title>
    <!-- Preconnect to API -->
    <link rel="preconnect" href="/api" />
    <!-- Inline critical CSS for initial render -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg-base: #F7F8FA;
        --primary: #4F5BD5;
        --text: #15171C;
      }
      body {
        font-family: "Geist", -apple-system, "PingFang SC", sans-serif;
        background: var(--bg-base);
        color: var(--text);
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .initial-loader-spinner {
        width: 32px;
        height: 32px;
        border: 2px solid var(--bg-base);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .initial-loader-text {
        color: var(--primary);
        font-size: 0.875rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state before React hydrates -->
      <div class="initial-loader">
        <div class="initial-loader-spinner"></div>
        <span class="initial-loader-text">正在打开 Keepline…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
